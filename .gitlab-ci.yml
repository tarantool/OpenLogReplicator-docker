# Debian release image
build release image debian:
  extends: .docker
  stage: build
  variables:
    DOCKER_BASE_IMAGE_NAME: "${DOCKER_IMAGE_NAME}-base-debian"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $BUILD_TYPE == "prod"'
      when: always
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
      when: always
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - |
      BASE_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_BASE_IMAGE_NAME}:latest"
      echo "Using base image: ${BASE_IMAGE}"

      # Build with custom base image
      BASE_IMAGE_NAME="${BASE_IMAGE}" ./build-prod.sh

      # Get version info from the generated OpenLogReplicator clone
      cd OpenLogReplicator
      GIT_DESCRIBE=$(git describe --tags --long 2>/dev/null | sed 's/^v//' | sed 's/-g/-/')
      cd ..
      echo "Version: ${GIT_DESCRIBE}"

      # Tag with debian suffix
      OLR_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:${GIT_DESCRIBE}"
      DEBIAN_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:${GIT_DESCRIBE}-debian"
      OLR_VERSION=$(echo "$GIT_DESCRIBE" | cut -d'-' -f1)
      RELEASE_TAG="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:${OLR_VERSION}-debian"
      LATEST_TAG="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:latest-debian"

      echo "Tagging and pushing Debian release images"
      docker tag "${OLR_IMAGE}" "${DEBIAN_IMAGE}"
      docker push "${DEBIAN_IMAGE}"

      docker tag "${OLR_IMAGE}" "${RELEASE_TAG}"
      docker push "${RELEASE_TAG}"

      docker tag "${OLR_IMAGE}" "${LATEST_TAG}"
      docker push "${LATEST_TAG}"

      docker push "${OLR_IMAGE}"

      # Extract binary
      apt-get update && apt-get install -y patchelf

      ARCHIVE_NAME="openlogreplicator-${GIT_DESCRIBE}-debian.tar.gz"
      ./extract-binary.sh "${DEBIAN_IMAGE}" "${ARCHIVE_NAME}"

      echo "Archive created: ${ARCHIVE_NAME}"
      echo "File size: $(stat -c%s "./${ARCHIVE_NAME}" 2>/dev/null || stat -f%z "./${ARCHIVE_NAME}" 2>/dev/null) bytes"

      # Upload to Nexus
      ./upload-to-nexus.sh "${ARCHIVE_NAME}" "${NEXUS_PROD_PATH}"

