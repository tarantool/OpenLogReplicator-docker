variables:
  OLR_BRANCH: "${OLR_BRANCH:-2.0.0}"
  GIDOLR: "1001"
  UIDOLR: "1001"
  GIDORA: "54322"
  DOCKER_IMAGE_NAME: openlogreplicator
  NEXUS_DEV_PATH: "openlogreplicator/dev"
  NEXUS_PROD_PATH: "openlogreplicator/prod"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^\d+\.\d+\.\d+$/'
    - if: '$CI_PIPELINE_SOURCE == "pipeline"'
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

stages:
  - build-base
  - build
  - test

.docker:
  image: "$OLR_CI_IMAGE"
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    KUBERNETES_CPU_REQUEST: "2"
    KUBERNETES_CPU_LIMIT: "8"
    KUBERNETES_MEMORY_REQUEST: "4Gi"
    KUBERNETES_MEMORY_LIMIT: "8Gi"
    KUBERNETES_HELPER_CPU_REQUEST: "0.5"
    KUBERNETES_HELPER_CPU_LIMIT: "1"
    KUBERNETES_HELPER_MEMORY_REQUEST: "1Gi"
    KUBERNETES_HELPER_MEMORY_LIMIT: "2Gi"
    KUBERNETES_SERVICE_EPHEMERAL_STORAGE_LIMIT: "100Gi"
    KUBERNETES_SERVICE_MEMORY_REQUEST: "8Gi"
    KUBERNETES_SERVICE_MEMORY_LIMIT: "16Gi"
  tags:
    - $OLR_CI_RUNNER
  services:
    - name: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/docker:26.1.4-dind
      alias: docker

# =============================================================================
# BASE IMAGES (dependencies only)
# =============================================================================

# Debian base image
build base image debian:
  extends: .docker
  stage: build-base
  interruptible: true
  variables:
    DOCKER_BASE_IMAGE_NAME: "${DOCKER_IMAGE_NAME}-base-debian"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile.base
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - |
      BASE_IMAGE_NAME="${CI_REGISTRY_IMAGE}/${DOCKER_BASE_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      LATEST_BASE="${CI_REGISTRY_IMAGE}/${DOCKER_BASE_IMAGE_NAME}:latest"

      echo "Building Debian base image: ${BASE_IMAGE_NAME}"
      docker build \
        -t "${BASE_IMAGE_NAME}" \
        -t "${LATEST_BASE}" \
        -f Dockerfile.base \
        --build-arg IMAGE=debian \
        --build-arg VERSION=13.0 \
        --build-arg GIDOLR=${GIDOLR} \
        --build-arg UIDOLR=${UIDOLR} \
        --build-arg WITHORACLE=1 \
        --build-arg WITHKAFKA=1 \
        --build-arg WITHPROMETHEUS=1 \
        --build-arg WITHPROTOBUF=1 \
        .

      echo "Pushing Debian base images"
      docker push "${BASE_IMAGE_NAME}"
      docker push "${LATEST_BASE}"

