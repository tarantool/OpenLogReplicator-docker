      docker tag "${OLR_IMAGE}" "${LATEST_TAG}"
      docker push "${LATEST_TAG}"
      docker push "${OLR_IMAGE}"

      # Extract binary
      ARCHIVE_NAME="openlogreplicator-${GIT_DESCRIBE}-solaris.tar.gz"
      ./extract-solaris.sh "${OLR_IMAGE}" "${ARCHIVE_NAME}"

      echo "Archive created: ${ARCHIVE_NAME}"
      echo "File size: $(stat -c%s "./${ARCHIVE_NAME}" 2>/dev/null || stat -f%z "./${ARCHIVE_NAME}" 2>/dev/null) bytes"

      # Upload to Nexus
      ./upload-to-nexus.sh "${ARCHIVE_NAME}" "${NEXUS_PROD_PATH}"
