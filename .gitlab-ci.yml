# Solaris SPARC base image
build base image solaris:
  extends: .docker
  stage: build-base
  interruptible: true
  variables:
    DOCKER_BASE_IMAGE_NAME: "${DOCKER_IMAGE_NAME}-base-solaris"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      changes:
        - Dockerfile.base.solaris
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "trigger"'
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - |
      BASE_IMAGE_NAME="${CI_REGISTRY_IMAGE}/${DOCKER_BASE_IMAGE_NAME}:${CI_COMMIT_SHORT_SHA}"
      LATEST_BASE="${CI_REGISTRY_IMAGE}/${DOCKER_BASE_IMAGE_NAME}:latest"

      : "${NEXUS_URL:?NEXUS_URL must be set}"
      : "${NEXUS_USER:?NEXUS_USER must be set}"
      : "${NEXUS_PASS:?NEXUS_PASS must be set}"

      echo "Downloading proprietary Solaris build artifacts"
      curl --fail --location --silent --show-error \
        --user "${NEXUS_USER}:${NEXUS_PASS}" \
        "${NEXUS_URL%/}/openlogreplicator/solaris/solaris-sysroot.tar.gz" \
        --output solaris-sysroot.tar.gz
      curl --fail --location --silent --show-error \
        --user "${NEXUS_USER}:${NEXUS_PASS}" \
        "${NEXUS_URL%/}/openlogreplicator/solaris/oracle-instantclient-18.3-solaris-sparc.tar.gz" \
        --output oracle-instantclient-18.3-solaris-sparc.tar.gz

      echo "Building Solaris SPARC base image: ${BASE_IMAGE_NAME}"
      docker build \
        -t "${BASE_IMAGE_NAME}" \
        -t "${LATEST_BASE}" \
        -f Dockerfile.base.solaris \
        --build-arg BASE_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}-base-centos7:latest" \
        --build-arg GIDOLR=${GIDOLR} \
        --build-arg UIDOLR=${UIDOLR} \
        .

      echo "Pushing Solaris SPARC base images"
      docker push "${BASE_IMAGE_NAME}"
      docker push "${LATEST_BASE}"

# ----------------------------------------------------------------------------
# Standalone C++ unit tests (tests/unit/*.cpp).
# ----------------------------------------------------------------------------
unit tests:
  stage: test
  interruptible: true
  needs: ["build dev image debian"]
  tags:
    - $CI_RUNNER
  image:
    name: $CI_REGISTRY_IMAGE/${DOCKER_IMAGE_NAME}:${OLR_DEV_DEBIAN_TAG}
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $BUILD_TYPE == "dev"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  variables:
    GIT_STRATEGY: none
  script:
    - cd /opt/OpenLogReplicator-local
    - |
      for t in tests/unit/*.cpp; do
        echo "=== $t ==="
        g++ -std=c++17 -I/opt/rapidjson/include "$t" -o /tmp/ut && /tmp/ut
      done

# ----------------------------------------------------------------------------
# Regression tests against Oracle XE 21c and Oracle Free 23c.
# ----------------------------------------------------------------------------
.test_oracle:
  extends: .docker
  stage: test
  interruptible: true
  needs: ["build dev image debian"]
  image:
    name: $CI_REGISTRY_IMAGE/${DOCKER_IMAGE_NAME}:${OLR_DEV_DEBIAN_TAG}
    entrypoint: [""]
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $BUILD_TYPE == "dev"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
  timeout: 60m
  variables:
    GIT_STRATEGY: none
  before_script:
    - cd /opt/OpenLogReplicator-local
  script:
    - make test ORACLE_TARGET="${ORACLE_TARGET}"
  after_script:
    # Collect oracle logs + healthcheck history + generated fixtures into
    # $CI_PROJECT_DIR so they end up in job artifacts. Tolerant of every step
    # missing — after_script must succeed even if the job exploded early.
    - |
      set +e
      cd /opt/OpenLogReplicator-local || exit 0
      OUT="${CI_PROJECT_DIR}/ci-artifacts/${ORACLE_TARGET}"
      mkdir -p "$OUT"
      COMPOSE_FILE="tests/1-environments/${ORACLE_TARGET}/docker-compose.yaml"
      if command -v docker >/dev/null 2>&1; then
        docker compose -f "$COMPOSE_FILE" logs --no-color --timestamps > "$OUT/oracle.log" 2>&1
        CID=$(docker compose -f "$COMPOSE_FILE" ps -q oracle 2>/dev/null)
        if [ -n "$CID" ]; then
          docker inspect "$CID" > "$OUT/oracle-inspect.json"
        fi
        cp -r tests/3-generated "$OUT/3-generated" 2>/dev/null
        cp -r tests/.work       "$OUT/work"        2>/dev/null
        make down ORACLE_TARGET="${ORACLE_TARGET}" 2>/dev/null
      fi
      exit 0
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - ci-artifacts/

test xe-21:
  extends: .test_oracle
  variables:
    ORACLE_TARGET: xe-21
    GIT_STRATEGY: none

test free-23:
  extends: .test_oracle
  variables:
    ORACLE_TARGET: free-23
    GIT_STRATEGY: none

# =============================================================================
# DEV IMAGES (built on MRs)
# =============================================================================

# Debian dev image
build dev image debian:
  extends: .docker
  stage: build
  interruptible: true
  needs: []  # не ждёт предыдущие стадии
  variables:
    DOCKER_BASE_IMAGE_NAME: "${DOCKER_IMAGE_NAME}-base-debian"
    WITHTESTS: "1"
    OLR_USER: "root"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "pipeline" && $BUILD_TYPE == "dev"'
      when: always
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == $CI_DEFAULT_BRANCH'
      when: always
  before_script:
    - echo "$CI_JOB_TOKEN" | docker login -u "$CI_REGISTRY_USER" "$CI_REGISTRY" --password-stdin
  script:
    - |
      BASE_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_BASE_IMAGE_NAME}:latest"
      echo "Using base image: ${BASE_IMAGE}"

      BASE_IMAGE_NAME="${BASE_IMAGE}" ./build-dev.sh

      # Get version info from the generated OpenLogReplicator clone
      cd OpenLogReplicator
      GIT_DESCRIBE=$(git describe --tags --long 2>/dev/null | sed 's/^v//' | sed 's/-g/-/')
      cd ..
      echo "Version: ${GIT_DESCRIBE}"

      # Tag with debian suffix
      OLR_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:${GIT_DESCRIBE}-dev"
      DEBIAN_TAG="${GIT_DESCRIBE}-dev-debian"
      DEBIAN_IMAGE="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:${DEBIAN_TAG}"
      LATEST_DEV="${CI_REGISTRY_IMAGE}/${DOCKER_IMAGE_NAME}:latest-dev-debian"

      echo "Tagging and pushing Debian dev image: ${DEBIAN_IMAGE}"
      docker tag "${OLR_IMAGE}" "${DEBIAN_IMAGE}"
      docker push "${DEBIAN_IMAGE}"

      docker tag "${OLR_IMAGE}" "${LATEST_DEV}"
      docker push "${LATEST_DEV}"

      docker push "${OLR_IMAGE}"

      echo "OLR_DEV_DEBIAN_TAG=${DEBIAN_TAG}" > build.env

      # Extract binary
      apt-get update && apt-get install -y patchelf

      ARCHIVE_NAME="openlogreplicator-${GIT_DESCRIBE}-debian.tar.gz"
      ./extract-binary.sh "${DEBIAN_IMAGE}" "${ARCHIVE_NAME}"

      echo "Archive created: ${ARCHIVE_NAME}"
      echo "File size: $(stat -c%s "./${ARCHIVE_NAME}" 2>/dev/null || stat -f%z "./${ARCHIVE_NAME}" 2>/dev/null) bytes"

      # Upload to Nexus
      ./upload-to-nexus.sh "${ARCHIVE_NAME}" "${NEXUS_DEV_PATH}"
  artifacts:
    reports:
      dotenv: build.env

